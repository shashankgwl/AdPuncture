<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AdPuncture | Local Tests</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 "Segoe UI", Aptos, Calibri, sans-serif; background: var(--cp-surface); color: var(--cp-text); }
    main { max-width: 1080px; margin: auto; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 20px; }
    nav { display: flex; gap: 12px; flex-wrap: wrap; margin: 16px 0; }
    button { padding: 8px 12px; font: inherit; background: var(--cp-surface); color: var(--cp-text); border: 1px solid var(--cp-border-strong); border-radius: 4px; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--cp-accent); outline-offset: 3px; }
    #stage { min-height: 220px; border-block: 1px solid var(--cp-border); background: var(--cp-surface-soft); padding: 12px 0; }
    video { display: block; width: min(640px, 100%); height: auto; aspect-ratio: 16 / 9; background: var(--cp-surface-soft); }
    #results { padding-left: 24px; overflow-wrap: anywhere; }
    .pass { color: var(--cp-success); }
    .fail { color: var(--cp-danger); }
    #summary { color: var(--cp-text-muted); }
    #stage:fullscreen { display: grid; place-items: center; }
    #stage:fullscreen video { width: min(100%, 1280px); }
  </style>
</head>
<body>
  <main>
    <h1>AdPuncture / Local Tests</h1>
    <nav aria-label="Test actions">
      <button id="run" type="button">Run simulated media tests</button>
      <button id="real" type="button">Generate local video</button>
      <button id="toggle" type="button">Toggle overlay</button>
      <button id="fullscreen" type="button">Fullscreen player</button>
    </nav>
    <div id="stage"></div>
    <p id="summary" role="status">Ready</p>
    <ol id="results"></ol>
  </main>
  <script src="../seek-logic.js"></script>
  <script src="fixture.js"></script>
</body>
</html>
